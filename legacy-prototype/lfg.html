<!DOCTYPE html>
<title>LFG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens (dark-first: bare :root is dark) ---------- */
  :root{
    --bg:#101119;
    --stage-a:#0c0d13;
    --stage-b:#181a26;
    --surface:#1c1e28;
    --surface-2:#23252f;
    --surface-3:#2b2d3a;
    --text:#f4f1ea;
    --text-muted:#9496a8;
    --text-faint:#63657a;
    --accent:#ff5a3c;
    --accent-dim:#5c2a20;
    --accent-ink:#1b0b06;
    --teal:#4cc9c0;
    --pass:#6c6e80;
    --border:rgba(244,241,234,0.09);
    --border-strong:rgba(244,241,234,0.16);
    --shadow:rgba(0,0,0,0.5);
    --danger:#e4483a;
    --chip-bg:rgba(244,241,234,0.06);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2efe8;
      --stage-a:#e7e2d6;
      --stage-b:#f6f3ec;
      --surface:#ffffff;
      --surface-2:#faf7f1;
      --surface-3:#f0ece2;
      --text:#1c1d24;
      --text-muted:#68697a;
      --text-faint:#9a9baa;
      --accent:#e0472a;
      --accent-dim:#f6d9d0;
      --accent-ink:#ffffff;
      --teal:#1f8f86;
      --pass:#8b8c9c;
      --border:rgba(28,29,36,0.10);
      --border-strong:rgba(28,29,36,0.18);
      --shadow:rgba(30,26,20,0.16);
      --danger:#c8382a;
      --chip-bg:rgba(28,29,36,0.05);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2efe8;
    --stage-a:#e7e2d6;
    --stage-b:#f6f3ec;
    --surface:#ffffff;
    --surface-2:#faf7f1;
    --surface-3:#f0ece2;
    --text:#1c1d24;
    --text-muted:#68697a;
    --text-faint:#9a9baa;
    --accent:#e0472a;
    --accent-dim:#f6d9d0;
    --accent-ink:#ffffff;
    --teal:#1f8f86;
    --pass:#8b8c9c;
    --border:rgba(28,29,36,0.10);
    --border-strong:rgba(28,29,36,0.18);
    --shadow:rgba(30,26,20,0.16);
    --danger:#c8382a;
    --chip-bg:rgba(28,29,36,0.05);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--stage-b), var(--stage-a) 65%);
    color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px 16px;
  }
  h1,h2,h3{font-family:'Chakra Petch', ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- phone stage ---------- */
  .phone{
    position:relative;
    width:min(412px, 100vw);
    height:min(890px, 100dvh);
    background:var(--surface);
    border-radius:38px;
    overflow:hidden;
    box-shadow: 0 30px 70px var(--shadow), 0 0 0 1px var(--border-strong);
    display:flex;
    flex-direction:column;
    isolation:isolate;
  }
  @media (max-width:460px){
    body{padding:0;}
    .phone{width:100vw; height:100dvh; border-radius:0; box-shadow:none;}
  }

  .screen{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* ---------- shared bits ---------- */
  .build-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--text-faint);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .build-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}

  .logo{display:inline-flex; align-items:center; gap:9px;}
  .logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg, var(--accent), #ff8a5c); display:flex;align-items:center;justify-content:center; flex-shrink:0; box-shadow:0 4px 14px rgba(255,90,60,0.35);}
  .logo-word{font-family:'Chakra Petch'; font-weight:700; font-size:20px; letter-spacing:.02em;}

  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:16px;}
  .field label{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted);}
  .field input{
    background:var(--surface-2);
    border:1.5px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:13px 14px;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .field input.invalid{border-color:var(--danger);}
  .field .err{font-size:12px; color:var(--danger); min-height:14px;}

  .btn{
    border:none; border-radius:13px; padding:14px 18px; font-size:15px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, opacity .15s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1.5px solid var(--border);}
  .btn-link{background:none; color:var(--teal); padding:4px; font-weight:600;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45; pointer-events:none;}

  .auth-wrap{padding:38px 26px 30px; display:flex; flex-direction:column; min-height:100%;}
  .auth-head{margin-bottom:30px;}
  .auth-tag{color:var(--text-muted); font-size:14px; margin-top:8px; line-height:1.5;}
  .auth-foot{margin-top:auto; padding-top:22px; text-align:center; font-size:13.5px; color:var(--text-muted);}
  .divider-row{display:flex; align-items:center; gap:10px; margin:22px 0; color:var(--text-faint); font-size:12px; letter-spacing:.06em; text-transform:uppercase;}
  .divider-row::before, .divider-row::after{content:""; flex:1; height:1px; background:var(--border);}

  /* ---------- otp ---------- */
  .otp-row{display:flex; gap:9px; margin:6px 0 26px;}
  .otp-row input{
    width:100%; aspect-ratio:1; text-align:center; font-size:20px; font-weight:700;
    font-family:'IBM Plex Mono'; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:12px; color:var(--text); outline:none;
  }
  .otp-row input:focus{border-color:var(--accent);}

  /* ---------- chips ---------- */
  .chip-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 14px; border-radius:100px; background:var(--chip-bg); border:1.5px solid var(--border);
    font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:.15s;
    display:inline-flex; align-items:center; gap:6px; user-select:none;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .avatar-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .avatar-opt{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:24px; cursor:pointer; border:2.5px solid transparent; transition:.15s;
  }
  .avatar-opt.on{border-color:var(--accent);}

  /* ---------- app shell ---------- */
  .app-header{
    padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0; border-bottom:1px solid var(--border); background:var(--surface);
    position:relative; z-index:5;
  }
  .header-title{font-family:'Chakra Petch'; font-weight:700; font-size:18px; letter-spacing:.01em;}
  .header-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .icon-btn{
    width:36px;height:36px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
  }

  .tab-content{flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; background:var(--bg);}
  .tab-content::-webkit-scrollbar{display:none;}
  .tab-pane{padding:18px 18px 110px;}

  /* ---------- bottom nav ---------- */
  .navbar{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    display:flex; justify-content:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    pointer-events:none;
  }
  .navbar-inner{
    pointer-events:auto;
    display:flex; gap:4px; background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid var(--border-strong);
    border-radius:22px; padding:8px; box-shadow:0 12px 30px var(--shadow);
    transition:opacity .45s ease, transform .45s ease;
  }
  .navbar-inner.faded{opacity:.32; transform:translateY(8px) scale(.98);}
  .nav-btn{
    width:64px; padding:8px 4px 7px; border:none; background:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; border-radius:15px;
    color:var(--text-faint); transition:color .15s, background .15s;
  }
  .nav-btn svg{width:21px;height:21px;}
  .nav-btn span{font-size:10.5px; font-weight:600; letter-spacing:.02em;}
  .nav-btn.active{color:var(--accent); background:var(--accent-dim);}

  /* ---------- swipe deck ---------- */
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; margin-bottom:14px; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0; padding:8px 13px; border-radius:100px; background:var(--surface-2); border:1.5px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; white-space:nowrap;}
  .filter-chip.on{background:var(--text); color:var(--bg); border-color:var(--text);}

  .deck{position:relative; height:min(560px, 62vh); margin:0 auto 16px; width:100%;}
  .card{
    position:absolute; inset:0; border-radius:26px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--border); box-shadow:0 20px 40px var(--shadow);
    display:flex; flex-direction:column; touch-action:none; will-change:transform;
    transition:transform .32s cubic-bezier(.2,.8,.3,1), opacity .32s;
  }
  .card.dragging{transition:none;}
  .card-art{
    height:56%; position:relative; display:flex; align-items:center; justify-content:center;
    font-size:76px; flex-shrink:0;
  }
  .card-art .indie-flag{
    position:absolute; top:12px; left:12px; background:rgba(16,17,25,0.55); color:#fff;
    font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
    padding:5px 9px; border-radius:100px; backdrop-filter:blur(6px);
  }
  .stamp{
    position:absolute; top:26px; padding:7px 16px; border:3.5px solid; border-radius:10px;
    font-family:'Chakra Petch'; font-weight:700; font-size:22px; letter-spacing:.06em;
    transform:rotate(-14deg); opacity:0; pointer-events:none; text-transform:uppercase;
  }
  .stamp.like{right:20px; border-color:var(--accent); color:var(--accent);}
  .stamp.pass{left:20px; border-color:var(--pass); color:var(--pass); transform:rotate(14deg);}

  .card-body{padding:16px 18px 14px; display:flex; flex-direction:column; gap:8px; flex:1; min-height:0;}
  .card-title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .card-title{font-family:'Chakra Petch'; font-size:19px; font-weight:700;}
  .card-price{font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; color:var(--teal); flex-shrink:0;}
  .card-tagline{font-size:12.5px; color:var(--text-muted); margin-top:-4px;}
  .card-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:4px 9px; border-radius:100px; background:var(--chip-bg); color:var(--text-muted);}
  .tag.mode{background:var(--accent-dim); color:var(--accent);}
  .card-desc{font-size:12.5px; color:var(--text-muted); line-height:1.5; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .card-quote{margin-top:auto; font-size:11.5px; color:var(--text-faint); font-style:italic; border-left:2px solid var(--border-strong); padding-left:8px;}

  .deck-controls{display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:6px;}
  .round-btn{
    width:56px;height:56px;border-radius:50%; border:1.5px solid var(--border-strong); background:var(--surface);
    display:flex;align-items:center;justify-content:center; cursor:pointer; box-shadow:0 8px 18px var(--shadow);
  }
  .round-btn.pass{color:var(--pass);}
  .round-btn.like{color:var(--accent); width:64px;height:64px;}
  .round-btn.info{width:44px;height:44px; color:var(--teal);}
  .round-btn svg{width:24px;height:24px;}

  .affinity-note{display:flex; align-items:center; gap:7px; justify-content:center; font-size:12px; color:var(--text-muted); margin-bottom:14px;}
  .affinity-note b{color:var(--teal); font-weight:600;}

  .empty-deck{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:40px 20px;}
  .empty-deck .glyph{font-size:52px;}

  /* ---------- lists (store / indie) ---------- */
  .section-label{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:4px 0 10px;}
  .list-card{
    display:flex; gap:12px; padding:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:17px; margin-bottom:11px; align-items:flex-start;
  }
  .list-art{width:58px;height:58px;border-radius:13px; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:28px;}
  .list-body{flex:1; min-width:0;}
  .list-title-row{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .list-title{font-family:'Chakra Petch'; font-weight:600; font-size:15px;}
  .platform-row{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .plat-btn{
    font-size:11px; font-weight:600; padding:6px 10px; border-radius:9px; background:var(--surface-2);
    border:1px solid var(--border); text-decoration:none; color:var(--text); display:inline-flex; gap:5px; align-items:center;
  }
  .remove-x{background:none;border:none;color:var(--text-faint); cursor:pointer; padding:4px; flex-shrink:0;}

  .empty-hint{text-align:center; padding:50px 24px; color:var(--text-muted); font-size:13.5px; line-height:1.6;}

  .indie-hero{
    background:linear-gradient(135deg, var(--surface-3), var(--surface-2)); border:1px solid var(--border);
    border-radius:20px; padding:20px; margin-bottom:20px;
  }
  .indie-hero h2{font-size:19px; margin-bottom:8px;}
  .indie-hero p{font-size:13px; color:var(--text-muted); line-height:1.55; margin:0 0 14px;}

  .form-note{font-size:11.5px; color:var(--text-faint); margin-top:-8px; margin-bottom:16px; line-height:1.5;}
  textarea{
    background:var(--surface-2); border:1.5px solid var(--border); color:var(--text); border-radius:12px;
    padding:12px 14px; font-size:14px; font-family:inherit; resize:vertical; min-height:70px; outline:none;
  }
  textarea:focus{border-color:var(--accent);}

  /* ---------- profile ---------- */
  .profile-head{display:flex; flex-direction:column; align-items:center; text-align:center; padding:12px 0 22px;}
  .profile-avatar{width:78px;height:78px;border-radius:24px; display:flex;align-items:center;justify-content:center; font-size:36px; margin-bottom:12px; box-shadow:0 10px 24px var(--shadow);}
  .profile-name{font-size:20px; margin-bottom:3px;}
  .profile-tag{font-size:13px; color:var(--text-muted);}
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px 0 22px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:14px 8px; text-align:center;}
  .stat-num{font-family:'IBM Plex Mono'; font-weight:600; font-size:19px; color:var(--teal);}
  .stat-lbl{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
  .menu-row{
    display:flex; align-items:center; justify-content:space-between; padding:15px 4px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .menu-row:last-child{border-bottom:none;}
  .menu-row-left{display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:500;}

  .back-header{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .toggle{width:42px;height:25px;border-radius:100px; background:var(--surface-3); position:relative; cursor:pointer; flex-shrink:0; border:1px solid var(--border);}
  .toggle.on{background:var(--accent);}
  .toggle-knob{position:absolute; top:2px; left:2px; width:19px;height:19px;border-radius:50%; background:#fff; transition:transform .18s;}
  .toggle.on .toggle-knob{transform:translateX(17px);}

  .danger-btn{color:var(--danger); background:none; border:1.5px solid var(--danger); border-radius:12px; padding:12px; font-weight:600; font-size:13.5px; cursor:pointer; width:100%;}
  .confirm-row{display:flex; gap:8px;}
  .confirm-row .btn{flex:1;}

  /* ---------- toast ---------- */
  .toast{
    position:absolute; left:20px; right:20px; bottom:96px; z-index:50;
    background:var(--text); color:var(--bg); padding:13px 16px; border-radius:13px; font-size:13.5px; font-weight:600;
    box-shadow:0 14px 30px var(--shadow); display:flex; align-items:center; gap:9px;
    animation:toast-in .28s ease;
  }
  @keyframes toast-in{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    .card, .navbar-inner, .toast, .toggle-knob{transition:none !important; animation:none !important;}
  }
</style>

<div class="phone" id="phone">
  <div id="screen" class="screen"></div>
</div>

  function loadState(){

  function esc(s){

  }

  /* ================= genre affinity / recommend ================= */
  function bumpAffinity(game, dir){
    game.genres.forEach(function(g){
      state.affinity[g] = (state.affinity[g]||0) + (dir==="liked" ? 1 : -0.4);
    });
  }
  function topGenre(){
    var best=null, bestScore=-Infinity;
    Object.keys(state.affinity).forEach(function(g){
      if(state.affinity[g] > bestScore){ bestScore=state.affinity[g]; best=g; }
    });
    return (best && bestScore>0.4) ? best : null;
  }
  function currentDeck(){
    var f = state.filters;
    return state.order
      .map(byId)
      .filter(function(g){ return g && !state.swiped[g.id]; })
      .filter(function(g){ return f.genre==="All" || g.genres.indexOf(f.genre)>-1; })
      .filter(function(g){ return f.mode==="All" || g.mode===f.mode; })
      .sort(function(a,b){
        function score(g){ return g.genres.reduce(function(s,gg){return s+(state.affinity[gg]||0);},0); }
        return score(b)-score(a);
      });
  }

  /* ================= render ================= */
  var root = document.getElementById("screen");

  function render(){
    saveState();
    var html;
    switch(state.screen){
      case "login": html = viewLogin(); break;
      case "signup": html = viewSignup(); break;
      case "forgot": html = viewForgot(); break;
      case "forgotSent": html = viewForgotSent(); break;
      case "verify": html = viewVerify(); break;
      case "onboard": html = viewOnboard(); break;
      case "app": html = viewApp(); break;
      default: html = viewLogin();
    }
    root.innerHTML = html;
    bindGlobal();
    switch(state.screen){
      case "login": bindLogin(); break;
      case "signup": bindSignup(); break;
      case "forgot": bindForgot(); break;
      case "forgotSent": bindForgotSent(); break;
      case "verify": bindVerify(); break;
      case "onboard": bindOnboard(); break;
      case "app": bindApp(); break;
    }
  }

  function bindVerify(){
    var boxes = root.querySelectorAll(".otp-box");
    boxes.forEach(function(b){
      b.addEventListener("input", function(){
        var i = +b.dataset.i;
        var v = b.value.replace(/[^0-9]/g,"").slice(0,1);
        state.otp[i] = v;
        if(v && boxes[i+1]) boxes[i+1].focus();
        render();
        var next = root.querySelectorAll(".otp-box")[Math.min(i+(v?1:0), boxes.length-1)];
        if(next) next.focus();
      });
      b.addEventListener("keydown", function(e){
        var i = +b.dataset.i;
        if(e.key==="Backspace" && !b.value && boxes[i-1]) boxes[i-1].focus();
      });
    });
    on("do-verify","click",function(){
      if(!state.otp.every(function(v){return v!=="";})) return;
      state.screen="onboard"; render();
    });

    return ''+
    '<div class="auth-wrap" style="padding-top:34px;">'+
      '<div class="auth-head"><h1 style="font-size:24px;">Set up your profile</h1><p class="auth-tag">This tunes your very first stack of games — swipes refine it from here.</p></div>'+
      '<div class="field"><label>Display name</label><input id="ob-name" type="text" value="'+esc(u.name)+'"></div>'+
      '<div class="field"><label>Pick an avatar</label><div class="avatar-grid" id="ob-avatars">'+avatarOpts+'</div></div>'+
      '<div class="field"><label>Genres you like</label><div class="chip-grid" id="ob-genres">'+genreChips+'</div></div>'+
      '<div class="field"><label>Where you play</label><div class="chip-grid" id="ob-plats">'+plats+'</div></div>'+
      '<button class="btn btn-primary btn-block" id="do-onboard" style="margin-top:6px;">Enter LFG</button>'+
    '</div>';
  }
  function bindOnboard(){
    root.querySelectorAll("#ob-avatars .avatar-opt").forEach(function(el){
      el.addEventListener("click", function(){ state.user.avatar = AVATARS[+el.dataset.i]; render(); });
    });
    root.querySelectorAll("#ob-genres .chip").forEach(function(el){
      el.addEventListener("click", function(){
        var g = el.dataset.genre;
        var i = state.user.genres.indexOf(g);
        if(i>-1) state.user.genres.splice(i,1); else state.user.genres.push(g);
        render();
      });
    });
    root.querySelectorAll("#ob-plats .chip").forEach(function(el){
      el.addEventListener("click", function(){
        var p = el.dataset.plat;
        var i = state.user.platforms.indexOf(p);
        if(i>-1) state.user.platforms.splice(i,1); else state.user.platforms.push(p);
        render();
      });
    });
    on("do-onboard","click",function(){
      state.user.name = val("ob-name") || state.user.name || "Player";
      state.user.genres.forEach(function(g){ state.affinity[g] = (state.affinity[g]||0) + 0.8; });
      state.screen = "app"; state.activeTab="home"; render();
    });
  }

  function backTopBar(id){
    return '<div style="padding:16px 16px 0;"><button class="icon-btn" id="'+id+'">'+ICONS.back+'</button></div>';
  }

  /* ---------- APP SHELL ---------- */
  var TABS = [
    {id:"home", label:"Home", icon:"home"},
    {id:"indie", label:"Indie Dev", icon:"indie"},
    {id:"profile", label:"Profile", icon:"profile"},
    {id:"store", label:"Store", icon:"store"}
  ];

  function viewApp(){
    var body;
    var headerTitle, headerSub;
    if(state.subScreen==="account"){
      return viewAccount();
    }
    switch(state.activeTab){
      case "home": body = viewHome(); headerTitle="Discover"; headerSub="Swipe to find your next game"; break;
      case "store": body = viewStore(); headerTitle="Your Store"; headerSub=(function(){var n=Object.keys(state.swiped).filter(function(k){return state.swiped[k]==="liked";}).length; return n+(n===1?" game":" games")+" wishlisted";})(); break;
      case "indie": body = viewIndie(); headerTitle="Indie Dev"; headerSub="Discover & submit indie games"; break;
      case "profile": body = viewProfile(); headerTitle="Profile"; headerSub="@"+ (state.user.name||"player").toLowerCase().replace(/\s+/g,""); break;
    }
    var navBtns = TABS.map(function(t){
      var active = state.activeTab===t.id;
      return '<button class="nav-btn'+(active?' active':'')+'" data-tab="'+t.id+'">'+ICONS[t.icon]+'<span>'+t.label+'</span></button>';
    }).join("");
    return ''+
      '<div class="app-header">'+
        '<div><div class="header-title">'+esc(headerTitle)+'</div><div class="header-sub">'+esc(headerSub)+'</div></div>'+
        Logo()+
      '</div>'+
      '<div class="tab-content" id="tab-scroll"><div class="tab-pane">'+body+'</div></div>'+
      '<div id="toast-slot"></div>'+
      '<div class="navbar"><div class="navbar-inner'+(state.navFaded?' faded':'')+'" id="navbar-inner">'+navBtns+'</div></div>';
  }

  function bindApp(){
    if(state.subScreen==="account"){ bindAccount(); return; }
    root.querySelectorAll(".nav-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.activeTab = btn.dataset.tab;
        state.subScreen = null;
        wakeNav();
        render();
      });
    });
    setupNavIdle();
    switch(state.activeTab){
      case "home": bindHome(); break;
      case "store": bindStore(); break;
      case "indie": bindIndie(); break;
      case "profile": bindProfile(); break;
    }
  }

  var navTimer = null;
  function wakeNav(){
    state.navFaded = false;
    var el = document.getElementById("navbar-inner");
    if(el) el.classList.remove("faded");
    clearTimeout(navTimer);
    navTimer = setTimeout(function(){
      state.navFaded = true;
      var el2 = document.getElementById("navbar-inner");
      if(el2) el2.classList.add("faded");
    }, 2600);
  }
  function setupNavIdle(){
    wakeNav();
    var scroller = document.getElementById("tab-scroll");
    ["pointerdown","scroll","touchmove"].forEach(function(evt){
      if(scroller) scroller.addEventListener(evt, wakeNav, {passive:true});
      root.addEventListener(evt, wakeNav, {passive:true});
    });
  }

  /* ---------- HOME (swipe deck) ---------- */
  function viewHome(){
    var deck = currentDeck();
    var tg = topGenre();
    var genreFilters = ["All"].concat(ALL_GENRES.filter(function(g){
      return GAMES.some(function(game){return game.genres.indexOf(g)>-1;});
    }));
    var filterChips = genreFilters.slice(0,9).map(function(g){
      return '<div class="filter-chip'+(state.filters.genre===g?' on':'')+'" data-genre="'+esc(g)+'">'+esc(g)+'</div>';
    }).join("");

    if(!deck.length){
      return ''+
        '<div class="filter-row">'+filterChips+'</div>'+
        '<div class="empty-deck">'+
          '<div class="glyph">🎉</div>'+
          '<h3 style="font-size:18px;">You\'ve cleared the queue</h3>'+
          '<p style="color:var(--text-muted);font-size:13.5px;max-width:260px;">No more games match these filters right now. Widen your filters or replay the demo deck.</p>'+
          '<button class="btn btn-primary" id="reset-deck">Replay demo deck</button>'+
        '</div>';
    }

    var top = deck[0];
    var cardsHtml = deck.slice(0,3).map(function(g,i){
      var style = i===0 ? "" : "transform:translateY("+(i*10)+"px) scale("+(1-i*0.045)+"); z-index:"+(10-i)+"; opacity:"+(1-i*0.25)+";";
      var grad = "linear-gradient(160deg,"+g.grad[0]+","+g.grad[1]+")";
      return ''+
      '<div class="card'+(i===0?" top-card":"")+'" data-id="'+g.id+'" style="'+style+' z-index:'+(10-i)+';">'+
        '<div class="card-art" style="background:'+grad+';">'+
          (g.indie?'<span class="indie-flag">Indie</span>':'')+
          '<span>'+g.glyph+'</span>'+
          (i===0? '<div class="stamp like" id="stamp-like">Yes</div><div class="stamp pass" id="stamp-pass">Pass</div>' : '')+
        '</div>'+
        '<div class="card-body">'+
          '<div class="card-title-row"><span class="card-title">'+esc(g.title)+'</span><span class="card-price">'+(g.price===0?"Free":"$"+g.price.toFixed(2))+'</span></div>'+
          '<div class="card-tagline">'+esc(g.tagline)+'</div>'+
          '<div class="card-tags"><span class="tag mode">'+esc(g.mode)+'</span>'+g.genres.map(function(gg){return '<span class="tag">'+esc(gg)+'</span>';}).join("")+'</div>'+
          '<div class="card-desc">'+esc(g.desc)+'</div>'+
          '<div class="card-quote">"'+esc(g.quote)+'" — '+esc(g.outlet)+'</div>'+
        '</div>'+
      '</div>';
    }).join("");

    return ''+
      '<div class="filter-row">'+filterChips+'</div>'+
      (tg ? '<div class="affinity-note">'+ICONS.info.replace('viewBox','width="13" height="13" viewBox')+'<span>Leaning into <b>'+esc(tg)+'</b> based on your swipes</span></div>' : '')+
      '<div class="deck" id="deck">'+cardsHtml+'</div>'+
      '<div class="deck-controls">'+
        '<button class="round-btn pass" id="btn-pass" title="Pass">'+ICONS.x+'</button>'+
        '<button class="round-btn info" id="btn-info" title="Details">'+ICONS.info+'</button>'+
        '<button class="round-btn like" id="btn-like" title="Add to wishlist">'+ICONS.heart+'</button>'+
      '</div>';
  }

  function bindHome(){
    root.querySelectorAll(".filter-chip").forEach(function(el){
      el.addEventListener("click", function(){ state.filters.genre = el.dataset.genre; render(); });
    });
    on("reset-deck","click",function(){
      state.swiped = {};
      state.order = shuffle(GAMES.map(function(g){return g.id;}));
      render();
    });
    var deck = currentDeck();
    if(!deck.length) return;
    var top = deck[0];
    var cardEl = root.querySelector('.card[data-id="'+top.id+'"]');
    if(!cardEl) return;

    on("btn-pass","click",function(){ animateAndCommit(cardEl, "passed"); });
    on("btn-like","click",function(){ animateAndCommit(cardEl, "liked"); });
    on("btn-info","click",function(){ showToast(top.title+" — full trailer & reviewer links arrive once game data connects live."); });

    var dragging=false, startX=0, startY=0, dx=0;
    var likeStamp = document.getElementById("stamp-like");
    var passStamp = document.getElementById("stamp-pass");

    cardEl.addEventListener("pointerdown", function(e){
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      cardEl.classList.add("dragging");
      cardEl.setPointerCapture(e.pointerId);
    });
    cardEl.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx = e.clientX - startX;
      var dy = (e.clientY - startY) * 0.4;
      var rot = dx/18;
      cardEl.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)";
      var t = Math.min(Math.abs(dx)/110, 1);
      if(likeStamp) likeStamp.style.opacity = dx>0 ? t : 0;
      if(passStamp) passStamp.style.opacity = dx<0 ? t : 0;
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      cardEl.classList.remove("dragging");
      if(Math.abs(dx) > 110){
        animateAndCommit(cardEl, dx>0 ? "liked" : "passed");
      } else {
        cardEl.style.transform = "translate(0,0) rotate(0)";
        if(likeStamp) likeStamp.style.opacity = 0;
        if(passStamp) passStamp.style.opacity = 0;
      }
      dx = 0;
    }
    cardEl.addEventListener("pointerup", endDrag);
    cardEl.addEventListener("pointercancel", endDrag);

    function animateAndCommit(el, dir){
      var flyX = dir==="liked" ? window.innerWidth : -window.innerWidth;
      el.style.transition = "transform .38s cubic-bezier(.2,.8,.3,1), opacity .38s";
      el.style.transform = "translate("+flyX+"px,-40px) rotate("+(dir==="liked"?24:-24)+"deg)";
      el.style.opacity = "0";
      setTimeout(function(){
        state.swiped[top.id] = dir;
        bumpAffinity(top, dir);
        if(dir==="liked") showToast("Added "+top.title+" to your wishlist");
        render();
      }, 220);
    }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  /* ---------- STORE ---------- */
  function viewStore(){
    var liked = Object.keys(state.swiped).filter(function(k){return state.swiped[k]==="liked";}).map(byId).filter(Boolean);
    if(!liked.length){
      return '<div class="empty-hint">🛒<br><br>Nothing here yet. Swipe right on <b>Home</b> to start building your wishlist — matched games land here with links to buy.</div>';
    }
    return liked.map(function(g){
      var grad = "linear-gradient(160deg,"+g.grad[0]+","+g.grad[1]+")";
      var plats = g.platforms.map(function(p){
        var m = PLATFORM_META[p];
        return '<a class="plat-btn" href="'+m.url+'" target="_blank" rel="noopener">View on '+m.label+'</a>';
      }).join("");
      return ''+
      '<div class="list-card">'+
        '<div class="list-art" style="background:'+grad+';">'+g.glyph+'</div>'+
        '<div class="list-body">'+
          '<div class="list-title-row"><span class="list-title">'+esc(g.title)+'</span><button class="remove-x" data-remove="'+g.id+'">'+ICONS.x.replace('viewBox','width="15" height="15" viewBox')+'</button></div>'+
          '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">'+g.genres.join(" · ")+' · '+(g.price===0?"Free":"$"+g.price.toFixed(2))+'</div>'+
          '<div class="platform-row">'+plats+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
  }
  function bindStore(){
    root.querySelectorAll("[data-remove]").forEach(function(el){
      el.addEventListener("click", function(){
        delete state.swiped[el.dataset.remove];
        render();
      });
    });
  }

  /* ---------- INDIE DEV ---------- */
  function viewIndie(){
    var spotlight = GAMES.filter(function(g){return g.indie;}).slice(0,4);
    var spotlightHtml = spotlight.map(function(g){
      var grad = "linear-gradient(160deg,"+g.grad[0]+","+g.grad[1]+")";
      var liked = state.swiped[g.id]==="liked";
      return ''+
      '<div class="list-card">'+
        '<div class="list-art" style="background:'+grad+';">'+g.glyph+'</div>'+
        '<div class="list-body">'+
          '<div class="list-title-row"><span class="list-title">'+esc(g.title)+'</span></div>'+
          '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">'+esc(g.tagline)+'</div>'+
          '<div class="platform-row"><button class="plat-btn" data-wishlist="'+g.id+'" style="border-color:var(--accent);color:var(--accent);">'+(liked?"On your wishlist":"+ Add to wishlist")+'</button></div>'+
        '</div>'+
      '</div>';
    }).join("");

    if(state.subScreen==="submitted"){
      return ''+
      '<div class="empty-deck" style="padding-top:60px;">'+
        '<div class="glyph">🚀</div>'+
        '<h3 style="font-size:18px;">Submitted for review</h3>'+
        '<p style="color:var(--text-muted);font-size:13.5px;max-width:260px;">Our (fictional, demo) curation team looks at every submission within 5 business days.</p>'+
        '<button class="btn btn-ghost" id="submit-back">Back to Indie Dev</button>'+
      '</div>';
    }

    return ''+
      '<div class="indie-hero">'+
        '<h2>Get discovered on LFG</h2>'+
        '<p>Every swipe-right on your game adds it to a real wishlist and surfaces it higher for players with matching taste. No algorithm blackout — just genre and mode signal, same as everyone else.</p>'+
      '</div>'+
      '<div class="section-label">This week\'s indie spotlight</div>'+
      spotlightHtml+
      '<div class="section-label" style="margin-top:22px;">Submit your game</div>'+
      '<div class="field"><label>Game title</label><input id="dev-title" type="text" placeholder="e.g. Molt"></div>'+
      '<div class="field"><label>Store link</label><input id="dev-link" type="text" placeholder="https://store.steampowered.com/..."></div>'+
      '<div class="field"><label>One-line pitch</label><textarea id="dev-pitch" placeholder="What makes it worth swiping right on?"></textarea></div>'+
      '<div class="field"><label>Contact email</label><input id="dev-email" type="email" placeholder="studio@yourgame.dev"></div>'+
      '<div class="form-note">Prototype form — nothing is sent yet. Wiring this to a real inbox is a backend step.</div>'+
      '<button class="btn btn-primary btn-block" id="dev-submit">Submit for review</button>';
  }
  function bindIndie(){
    root.querySelectorAll("[data-wishlist]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.wishlist;
        if(state.swiped[id]!=="liked"){
          state.swiped[id] = "liked";
          bumpAffinity(byId(id), "liked");
          showToast("Added "+byId(id).title+" to your wishlist");
        }
        render();
      });
    });
    on("dev-submit","click",function(){
      var title = val("dev-title");
      if(!title.trim()){ showToast("Add a game title first"); return; }
      state.subScreen = "submitted"; render();
    });
    on("submit-back","click",function(){ state.subScreen=null; render(); });
  }

  /* ---------- PROFILE ---------- */
  function viewProfile(){
    var u = state.user;
    var likedCount = Object.keys(state.swiped).filter(function(k){return state.swiped[k]==="liked";}).length;
    var passedCount = Object.keys(state.swiped).filter(function(k){return state.swiped[k]==="passed";}).length;
    var tg = topGenre() || "—";
    var genreChips = (u.genres.length?u.genres:["Add your favorite genres"]).map(function(g){return '<span class="tag">'+esc(g)+'</span>';}).join("");
    var platChips = (u.platforms.length?u.platforms:[]).map(function(p){return '<span class="tag">'+PLATFORM_META[p].label+'</span>';}).join("") || '<span class="tag">No platforms set</span>';
    return ''+
    '<div class="profile-head">'+
      '<div class="profile-avatar" style="background:'+u.avatar.color+'22;color:'+u.avatar.color+';">'+u.avatar.emoji+'</div>'+
      '<div class="profile-name">'+esc(u.name||"Player")+'</div>'+
      '<div class="profile-tag">'+esc(u.bio)+'</div>'+
    '</div>'+
    '<div class="stat-row">'+
      '<div class="stat-card"><div class="stat-num">'+likedCount+'</div><div class="stat-lbl">Liked</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+passedCount+'</div><div class="stat-lbl">Passed</div></div>'+
      '<div class="stat-card"><div class="stat-num" style="font-size:14px;">'+esc(tg)+'</div><div class="stat-lbl">Top genre</div></div>'+
    '</div>'+
    '<div class="section-label">Favorite genres</div>'+
    '<div class="chip-grid" style="margin-bottom:20px;">'+genreChips+'</div>'+
    '<div class="section-label">Platforms</div>'+
    '<div class="chip-grid" style="margin-bottom:22px;">'+platChips+'</div>'+
    '<div class="section-label">Settings</div>'+
    '<div>'+
      '<div class="menu-row" id="open-account"><span class="menu-row-left">'+ICONS.gear.replace('viewBox','width="17" height="17" viewBox')+' Account &amp; settings</span><span style="color:var(--text-faint);">›</span></div>'+
      '<div class="menu-row" id="do-logout"><span class="menu-row-left" style="color:var(--danger);">'+ICONS.logout.replace('viewBox','width="17" height="17" viewBox')+' Log out</span></div>'+
    '</div>';
  }
  function bindProfile(){
    on("open-account","click",function(){ state.subScreen="account"; render(); });
    on("do-logout","click",function(){
      state.screen="login"; state.activeTab="home"; state.subScreen=null;
      showToast("Logged out");
      render();
    });
  }

  /* ---------- ACCOUNT (sub-screen) ---------- */
  function viewAccount(){
    var u = state.user;
    var n = state.notif;
    return ''+
    '<div class="back-header"><button class="icon-btn" id="acct-back">'+ICONS.back+'</button><h3 style="font-size:17px;">Account &amp; settings</h3></div>'+
    '<div class="tab-content"><div class="tab-pane">'+
      '<div class="section-label">Profile</div>'+
      '<div class="field"><label>Display name</label><input id="acct-name" type="text" value="'+esc(u.name)+'"></div>'+
      '<div class="field"><label>Email</label><input id="acct-email" type="email" value="'+esc(u.email)+'"></div>'+
      '<div class="field"><label>Bio</label><textarea id="acct-bio">'+esc(u.bio)+'</textarea></div>'+
      '<button class="btn btn-primary btn-block" id="acct-save" style="margin-bottom:26px;">Save changes</button>'+

      '<div class="section-label">Notifications</div>'+
      '<div class="menu-row"><span class="menu-row-left">'+ICONS.bell.replace('viewBox','width="17" height="17" viewBox')+' New match alerts</span><div class="toggle'+(n.matches?' on':'')+'" id="tg-matches"><div class="toggle-knob"></div></div></div>'+
      '<div class="menu-row"><span class="menu-row-left">'+ICONS.bell.replace('viewBox','width="17" height="17" viewBox')+' Weekly indie digest</span><div class="toggle'+(n.digest?' on':'')+'" id="tg-digest"><div class="toggle-knob"></div></div></div>'+

      '<div class="section-label" style="margin-top:26px;">Danger zone</div>'+
      (state.deleteConfirm ?
        '<div class="confirm-row"><button class="btn btn-ghost" id="del-cancel">Cancel</button><button class="btn" style="background:var(--danger);color:#fff;" id="del-confirm">Yes, delete</button></div>'
        : '<button class="danger-btn" id="del-account">Delete account</button>')+
    '</div></div>';
  }
  function bindAccount(){
    on("acct-back","click",function(){ state.subScreen=null; render(); });
    on("acct-save","click",function(){
      state.user.name = val("acct-name")||state.user.name;
      state.user.email = val("acct-email")||state.user.email;
      state.user.bio = val("acct-bio")||state.user.bio;
      showToast("Settings saved");
      render();
    });
    on("tg-matches","click",function(){ state.notif.matches=!state.notif.matches; render(); });
    on("tg-digest","click",function(){ state.notif.digest=!state.notif.digest; render(); });
    on("del-account","click",function(){ state.deleteConfirm=true; render(); });
    on("del-cancel","click",function(){ state.deleteConfirm=false; render(); });
    on("del-confirm","click",function(){
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      try{ localStorage.removeItem("lfg_demo_state_v1"); }catch(e){}
      render();
    });
  }

  /* ---------- helpers ---------- */
  function on(id, evt, fn){ var el=document.getElementById(id); if(el) el.addEventListener(evt, fn); }
  function val(id){ var el=document.getElementById(id); return el ? el.value : ""; }
  function setErr(id, msg){ var el=document.getElementById(id); if(el) el.textContent = msg; }
  function mark(id, bad){ var el=document.getElementById(id); if(el) el.classList.toggle("invalid", !!bad); }

  /* hot-reload friendliness for the artifact host */
  function boot(initial){
    if(initial && initial.state){ state = Object.assign({}, state, initial.state); }
    render();
  }
  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return {state: state}; });
      window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data ? {state:window.claude.hot.data} : null);
    } else {
      boot(null);
    }
  }catch(e){ boot(null); }
})();
</script>
